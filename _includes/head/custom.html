<!-- Website icons -->
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ '/images/apple-touch-icon.png' | relative_url }}"
>

<link
  rel="icon"
  type="image/png"
  href="{{ '/images/q.png' | relative_url }}?v=2"
>

<link
  rel="manifest"
  href="{{ '/images/site.webmanifest' | relative_url }}"
>

<meta name="msapplication-TileColor" content="#000000">

<meta
  name="msapplication-TileImage"
  content="{{ '/images/mstile-144x144.png' | relative_url }}?v=M44lzPylqQ"
>

<meta
  name="msapplication-config"
  content="{{ '/images/browserconfig.xml' | relative_url }}?v=M44lzPylqQ"
>

<meta name="theme-color" content="#ffffff">

<!-- Academic icons -->
<link
  rel="stylesheet"
  href="{{ '/assets/css/academicons.css' | relative_url }}"
>

<!-- MathJax configuration -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: {
      equationNumbers: {
        autoNumber: "all"
      }
    }
  });
</script>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [
        ['$', '$'],
        ["\\(", "\\)"]
      ],
      processEscapes: true
    }
  });
</script>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML"
  async>
</script>

<!-- End custom head snippets -->
