# Welcome to Jekyll!
#
# This config file is meant for settings that affect
# your entire site, values which you are expected to
# set up once and rarely need to edit after that.
#
# If you change this file, please restart Jekyll.

# Site Settings
title                    : "Guoqiang Yang"
description              : "A CS Ph.D. Student chasing light. <br> 🤖AI for Optics <br> 🌟Optics for AI"
description_zh           : "一名追逐光的计算机博士生。<br> 🤖 人工智能赋能光学 <br> 🌟 光学赋能人工智能"

repository               : "guoqiangyang/guoqiangyang.github.io"
google_scholar_stats_use_cdn : true

# Google Analytics
# google_analytics_id      :

# SEO Related
# google_site_verification :
# bing_site_verification   :
# baidu_site_verification  :

# Site Author
author:
  name             : "Guoqiang Yang"
  name_zh          : "杨国强"

  avatar           : "images/q.png"

  bio              : "Shanghai Jiao Tong University"
  bio_zh           : "上海交通大学"

  location         : "Shanghai, China"
  location_zh      : "中国·上海"

  employer         :
  pubmed           :
  googlescholar    :

  email            : guoqiangyang@sjtu.edu.cn
  researchgate     :

  uri              : "https://guoqiangyang.github.io"
  baseurl          : ""

  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :

  github           : "guoqiangyang"

  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  dblp             :
  orcid            :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
